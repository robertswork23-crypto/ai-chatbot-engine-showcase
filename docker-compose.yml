version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-chatbot-engine-postgres
    restart: always
    environment:
      - POSTGRES_USER=chatbot
      - POSTGRES_PASSWORD=chatbot
      - POSTGRES_DB=ai_chatbot_engine
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - chatbot_network

  chatbot:
    build: .
    container_name: ai-chatbot-engine
    restart: always
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://chatbot:chatbot@postgres:5432/ai_chatbot_engine
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
    networks:
      - chatbot_network

volumes:
  pg_data:

networks:
  chatbot_network:
    driver: bridge
